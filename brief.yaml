infra:
  hosting: cloud-run
  db: supabase
  auth: supabase
  ai: null
  payments: stripe
  stripe_mode: null  # ⚠️ 要確認

billing:
  model: "subscription + topup"
  plans:
    - name: Free
      price: 0
      currency: JPY
    - name: Plus
      price: 680
      credits: 600
      currency: JPY
      interval: monthly
    - name: Pro
      price: 1980
      credits: 2000
      currency: JPY
      interval: monthly
  topup:
    - credits: 300
      price: 300
      currency: JPY
    - credits: 1200
      price: 1000
      currency: JPY

security:
  auth_method: supabase
  rate_limit: "クレジット制"
  data_retention: null

go_condition: "Phase 0検証ゲート通過後にPhase 1実装"

db_schema:
  schema_name: betaship
  tables:
    - table: betaship.subscriptions
      role: "課金状態の正源"
      key_columns: "user_id, plan(free/plus/pro), stripe_customer_id, stripe_subscription_id"
    - table: betaship.credits
      role: "クレジット残高（月次+追加）"
      key_columns: "user_id, monthly_cr, topup_cr"
    - table: betaship.plan_config
      role: "プランごとの月次クレジット設定"
      key_columns: "plan, monthly_cr"
    - table: betaship.product_config
      role: "全体フラグ管理"
      key_columns: "free_mode, billing_active, stripe_mode"

conversion_plan:
  method: A方式
  note: "既存ユーザーはBetashipクレジットに自動変換。B方式（個別課金先廃止）は不採用"
  examples:
    - "Moshimo Pro ¥680/月 → 600cr/月（Plus相当）"
    - "Wearld $9買い切り → 900cr（トップアップ相当）"

marketing:
  x_posting: "週3・12角度（失敗型・問い型・制作型を含む）"
  warning: "宣伝感が出た瞬間に終わり"
  x_auto_post: "2026-05-12確定。再開可能"

