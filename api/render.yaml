services:
  - type: web
    name: betaship-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn proxy:app
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BETASHIP_SUPABASE_URL
        sync: false
      - key: BETASHIP_SUPABASE_SERVICE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MAKER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_TOPUP_300
        sync: false
      - key: STRIPE_PRICE_TOPUP_1200
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: APP_BASE_URL
        value: https://betaship.web.app
      - key: ALLOWED_ORIGINS
        value: https://moshimo-ai.web.app,https://await-ai.web.app,https://wearld.vercel.app,https://reverie-music.vercel.app,https://betaship.web.app
      - key: KEEPALIVE_URL
        sync: false
